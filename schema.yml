components:
  schemas:
    AdditionalNameProject:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
    AppToKill:
      type: object
      properties:
        killing_flag:
          type: boolean
    BasicStatistics:
      type: object
      properties:
        total_samples:
          type: integer
        out_of_date_samples:
          type: integer
        in_date:
          type: integer
        pass_type:
          type: integer
        fail_type:
          type: integer
        calib_type:
          type: integer
        testers:
          type: integer
        no_testers:
          type: integer
        highest_counter:
          type: integer
      required:
      - calib_type
      - fail_type
      - highest_counter
      - in_date
      - no_testers
      - out_of_date_samples
      - pass_type
      - testers
      - total_samples
    BoschSilliconCheck:
      type: object
      properties:
        sn:
          type: string
        place:
          type: string
      required:
      - place
      - sn
    CheckMasterSampleFWK:
      type: object
      properties:
        sn:
          type: string
        site:
          type: integer
        machine_id:
          type: string
        result:
          type: string
          nullable: true
        internal_code:
          type: string
      required:
      - internal_code
      - machine_id
      - site
      - sn
    ClearSamplesResultSer:
      type: object
      properties:
        site:
          type: integer
        machine_id:
          type: string
      required:
      - machine_id
    ClientName:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
    CodeSmd:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 255
      required:
      - code
      - id
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        color:
          type: string
          nullable: true
          maxLength: 255
      required:
      - id
      - name
    DiagnosisFile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        active:
          type: boolean
          readOnly: true
        file:
          type: string
          format: uri
          pattern: (?:txt)$
      required:
      - active
      - file
      - id
    EndCode:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 255
      required:
      - code
      - id
    ForceValidMachine:
      type: object
      properties:
        machine_name:
          type: string
        hours:
          type: integer
      required:
      - hours
      - machine_name
    ForceValidMachineSerializerApp:
      type: object
      properties:
        machine_name:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - machine_name
      - password
    FullInfoFixture:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        counter_all:
          type: number
          format: double
          readOnly: true
        counter_last_maint:
          type: number
          format: double
          readOnly: true
        last_maint_date:
          type: string
          format: date-time
          readOnly: true
        limit_procent:
          type: string
          readOnly: true
        cycles_limit:
          type: integer
          readOnly: true
      required:
      - counter_all
      - counter_last_maint
      - cycles_limit
      - id
      - last_maint_date
      - limit_procent
      - name
    FullStatistics:
      type: object
      properties:
        stats:
          $ref: '#/components/schemas/BasicStatistics'
        top_client:
          $ref: '#/components/schemas/ClientName'
        top_adding_user:
          $ref: '#/components/schemas/User'
      required:
      - stats
      - top_adding_user
      - top_client
    GoldensMainValidation:
      type: object
      properties:
        goldens:
          type: array
          items:
            type: string
        machine_name:
          type: string
        phase_id:
          type: string
        unique_id:
          type: string
          format: uuid
          nullable: true
      required:
      - goldens
      - machine_name
      - phase_id
    GoldensTypeValidation:
      type: object
      properties:
        goldens:
          type: object
          additionalProperties:
            type: string
        machine_name:
          type: string
      required:
      - goldens
      - machine_name
    LocationSpea:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
    LogFromMistake:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        process_uuid_raw:
          type: string
          nullable: true
          maxLength: 255
        place_name_raw:
          type: string
          nullable: true
          maxLength: 255
        product_sn:
          type: string
          maxLength: 255
        who:
          type: string
          nullable: true
          maxLength: 255
        error_message:
          type: string
        error_code:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        movement_type:
          type: string
          nullable: true
          maxLength: 255
        date_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        process:
          type: string
          format: uuid
          nullable: true
        place:
          type: integer
          nullable: true
        product_object:
          type: integer
          nullable: true
      required:
      - created_at
      - date_time
      - error_code
      - error_message
      - id
      - product_sn
    MachineFullValidation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_valid:
          type: boolean
        time_date:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ended:
          type: boolean
      required:
      - id
      - time_date
    MachineInvalidate:
      type: object
      properties:
        machine_name:
          type: string
      required:
      - machine_name
    MachineInvalidation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date_time_start:
          type: string
          format: date-time
          readOnly: true
        date_time_end:
          type: string
          format: date-time
        is_valid:
          type: boolean
      required:
      - date_time_end
      - date_time_start
      - id
    MachineMain:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        forcevalidation:
          type: array
          items:
            $ref: '#/components/schemas/MachineInvalidation'
          readOnly: true
        fullvalidation:
          type: array
          items:
            $ref: '#/components/schemas/MachineFullValidation'
          readOnly: true
